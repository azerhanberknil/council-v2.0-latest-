[package]
name = "council-desktop"
version = "1.0.0"
description = "Council desktop application"
authors = ["Council"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "council_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
